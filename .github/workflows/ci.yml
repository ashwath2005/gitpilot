name: GitPilot CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Validate
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Version Consistency
        run: npm run version:check

      - name: Build Frontend Application
        run: npm run build

      - name: Verify Build Artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "Build verification failed: dist/index.html not found!"
            exit 1
          }
          Write-Host "✅ Production bundle verified successfully (dist/index.html exists)."

      - name: Generate CI Summary
        if: always()
        shell: pwsh
        run: |
          $status = if ("${{ job.status }}" -eq "success") { "PASSED ✅" } else { "FAILED ❌" }
          @"
          ### 🛠️ GitPilot CI Summary
          - **Commit**: \`${{ github.sha }}\`
          - **Branch**: \`${{ github.ref_name }}\`
          - **Status**: **$status**
          - **Node.js**: \`20.x\`
          - **Vite Build**: Verified
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
